[project]
name = "smartcourse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "faraz-jahangir-emumba", email = "faraz.jahangir@emumba.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
smartcourse = "smartcourse:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Lets async test functions run without decorating every one of them.
asyncio_mode = "auto"
# Puts the project root on sys.path, so tests can import `tests.conftest`
# for shared helpers. Without it pytest only adds the rootdir when tests/ is a
# package, which would mean an otherwise pointless __init__.py.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
