[project]
name = "smartcourse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "faraz-jahangir-emumba", email = "faraz.jahangir@emumba.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
smartcourse = "smartcourse:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
