[project]
name = "smartcourse"
version = "0.1.0"
description = "Backend for SmartCourse, EduCorp's course delivery platform"
readme = "README.md"
authors = [
    { name = "faraz-jahangir-emumba", email = "faraz.jahangir@emumba.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
smartcourse = "smartcourse:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Lets async test functions run without decorating every one of them.
asyncio_mode = "auto"
# Puts the project root on sys.path, so tests can import `tests.conftest`
# for shared helpers. Without it pytest only adds the rootdir when tests/ is a
# package, which would mean an otherwise pointless __init__.py.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Alembic writes these, not us. They are a record of what was already run
# against a database, so rewriting one to satisfy a style rule changes
# history for no benefit - and the few findings in them are all from
# Alembic's own template.
exclude = ["src/smartcourse/infra/db/migrations"]

line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Beyond the default E and F, each of these was added because it catches
# something this project can actually get wrong:
#
#   I       import order, so a merge does not reorder them for you
#   UP      Python 3.12 is the floor; no reason to write 3.8
#   B       bugbear - mutable default arguments, loop-variable closures
#   SIM     needless complexity that reads as if it means something
#   C4      comprehensions written as calls to list() and dict()
#   ASYNC   blocking calls inside async functions. The whole stack is
#           async, and one sync call inside an endpoint stalls every other
#           request on the loop - the single most expensive mistake
#           available here, and invisible in a passing test
#   LOG     logging mistakes, including calls on the root logger
#   BLE     blind `except Exception`, where it swallows rather than re-raises
#   RUF     ruff's own, which includes RUF100 below
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "LOG", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# LESSON is three paragraphs of prose, one per line, and the chunker is
# measured against it word for word. Wrapping it would put newlines inside
# the text under test - which the sentence splitter would probably survive,
# and "probably" is not a word to use about the fixture a token-counting
# test depends on.
"tests/test_chunking.py" = ["E501"]

# RUF100 flags a `# noqa` that suppresses nothing. Worth saying out loud:
# it found fourteen on the first run - comments written against rules that
# were never enabled, suppressing warnings nobody was issuing. A dead
# suppression is worse than none, because the next reader believes it.

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.3",
]
