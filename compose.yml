# Describes the servers SmartCourse needs, so anyone can start them with one
# command instead of installing each by hand.
#
# Right now that is only Postgres. Mongo, Redis, Kafka, RabbitMQ and Temporal
# get added in later modules, as each one is actually needed.

# A name for this group of containers. Without it, Docker uses the folder name
# ("educorp"), which would not match the project.
name: smartcourse

services:
  # "postgres" is the name of this service. It is also the hostname other
  # containers would use to reach it later.
  postgres:
    # The exact image to download and run. postgres:16 is the official image.
    # Pinning 16 rather than "latest" means it stays the same version tomorrow.
    image: postgres:16

    # If the container stops - a crash, or a machine restart - start it again.
    restart: unless-stopped

    # Settings the Postgres image reads on first start. These create the
    # database and the user your app will log in as.
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse

    # "host:container". The database listens on 5432 inside the container;
    # this makes it reachable at localhost:5432 on Windows too.
    # Without this line the container runs, but nothing outside can reach it.
    ports:
      - "5432:5432"

    # Where the data actually lives.
    # A container's own filesystem is thrown away when it is removed. A volume
    # is storage that outlives the container, so your tables survive a restart.
    # Left out, every `docker compose down` would wipe the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # How Docker knows Postgres is not just running, but ready to accept
    # connections. There is a gap of a few seconds between the two, and things
    # that connect during that gap fail. Later services will wait on this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcourse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply migrations, then exit.
  #
  # Its own service rather than something the API does at startup. Two
  # reasons: running several API containers would mean several of them
  # migrating at once, and a migration failure should stop the deploy rather
  # than leave a server running against a schema it does not match.
  #
  # `service_completed_successfully` below is what makes the API wait for it.
  migrate:
    build: .
    command: uv run alembic upgrade head
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      # "postgres", not "localhost". Inside a container localhost is the
      # container itself; the service name is how Docker's DNS finds the
      # database.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  # The API.
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ENVIRONMENT: local
    depends_on:
      # Not just "postgres is healthy" - the schema has to exist too, or the
      # first request fails on a missing table.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# Declares the volume used above. Docker manages where it physically sits.
volumes:
  postgres-data:
