# Describes the servers SmartCourse needs, so anyone can start them with one
# command instead of installing each by hand.
#
# Right now that is only Postgres. Mongo, Redis, Kafka, RabbitMQ and Temporal
# get added in later modules, as each one is actually needed.

# A name for this group of containers. Without it, Docker uses the folder name
# ("educorp"), which would not match the project.
name: smartcourse

services:
  # "postgres" is the name of this service. It is also the hostname other
  # containers would use to reach it later.
  postgres:
    # The exact image to download and run. postgres:16 is the official image.
    # Pinning 16 rather than "latest" means it stays the same version tomorrow.
    image: postgres:16

    # If the container stops - a crash, or a machine restart - start it again.
    restart: unless-stopped

    # Settings the Postgres image reads on first start. These create the
    # database and the user your app will log in as.
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse

    # "host:container". The database listens on 5432 inside the container;
    # this makes it reachable at localhost:5432 on Windows too.
    # Without this line the container runs, but nothing outside can reach it.
    ports:
      - "5432:5432"

    # Where the data actually lives.
    # A container's own filesystem is thrown away when it is removed. A volume
    # is storage that outlives the container, so your tables survive a restart.
    # Left out, every `docker compose down` would wipe the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # How Docker knows Postgres is not just running, but ready to accept
    # connections. There is a gap of a few seconds between the two, and things
    # that connect during that gap fail. Later services will wait on this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcourse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal, for the publishing workflow. Guidelines Week 2 names it, and
  # Part A's tech stack lists it as "Temporal (workflows)".
  #
  # This is the *development* server: one container holding the server, its
  # storage and its web UI. The production shape is five containers - Postgres,
  # a schema-setup job, the server, a namespace-creation job, and a separate
  # UI - which is what temporalio/samples-server publishes. We do not need any
  # of that to learn the programming model, and every extra container is
  # another thing that can fail on a laptop.
  #
  # What we give up: history is kept in a SQLite file rather than Postgres,
  # so this is not how it would be deployed. Worth being able to say out loud.
  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped

    # 7233 is the gRPC port our worker and API connect to.
    # 8233 serves the web UI - open it to watch a workflow run step by step.
    ports:
      - "7233:7233"
      - "8233:8233"

    # Temporal's own bookkeeping: which step each workflow reached, what every
    # activity returned, what failed and what is still pending. Without the
    # volume, every restart forgets every workflow - which is the one thing
    # Temporal exists not to do.
    volumes:
      - temporal-data:/home/temporal

    # --ip 0.0.0.0 makes it listen on all interfaces inside the container, so
    # the published ports above actually reach it. Bound to localhost (the
    # default) it would only be reachable from inside the container.
    #
    # start-dev also creates the "default" namespace on its own. The
    # production setup needs a separate container just for that.
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db

    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply migrations, then exit.
  #
  # Its own service rather than something the API does at startup. Two
  # reasons: running several API containers would mean several of them
  # migrating at once, and a migration failure should stop the deploy rather
  # than leave a server running against a schema it does not match.
  #
  # `service_completed_successfully` below is what makes the API wait for it.
  migrate:
    build: .
    command: uv run alembic upgrade head
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      # "postgres", not "localhost". Inside a container localhost is the
      # container itself; the service name is how Docker's DNS finds the
      # database.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  # Create the first admin, then exit. Beside migrate, and for the same
  # reason: it is a job, not a server.
  #
  # Admin is not self-assignable and no endpoint grants it, so without this
  # the only way to get one is editing the database by hand - which is what
  # the Week 1 review found.
  #
  # Runs on every `docker compose up` and is safe to. With no ADMIN_EMAIL set
  # it prints a line and exits 0, so a fresh clone with no .env still comes
  # up green. With one set it creates the account, and running again finds it
  # already there and changes nothing.
  seed:
    build: .
    command: uv run python -m smartcourse.seed
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Passed through from your shell or .env, with no default here. A
      # default admin password is a published admin password.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      # After the tables exist, obviously - it inserts a row.
      migrate:
        condition: service_completed_successfully

  # The API.
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ENVIRONMENT: local
    depends_on:
      # Not just "postgres is healthy" - the schema has to exist too, or the
      # first request fails on a missing table.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# Declares the volumes used above. Docker manages where they physically sit.
volumes:
  postgres-data:
  temporal-data:
