# Describes the servers SmartCourse needs, so anyone can start them with one
# command instead of installing each by hand.
#
# Postgres and Temporal from Modules 1 and 2, Kafka from Module 3. Mongo,
# Redis and RabbitMQ get added as each one is actually needed.

# A name for this group of containers. Without it, Docker uses the folder name
# ("educorp"), which would not match the project.
name: smartcourse

services:
  # "postgres" is the name of this service. It is also the hostname other
  # containers would use to reach it later.
  postgres:
    # The exact image to download and run. postgres:16 is the official image.
    # Pinning 16 rather than "latest" means it stays the same version tomorrow.
    image: postgres:16

    # If the container stops - a crash, or a machine restart - start it again.
    restart: unless-stopped

    # Settings the Postgres image reads on first start. These create the
    # database and the user your app will log in as.
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse

    # "host:container". The database listens on 5432 inside the container;
    # this makes it reachable at localhost:5432 on Windows too.
    # Without this line the container runs, but nothing outside can reach it.
    ports:
      - "5432:5432"

    # Where the data actually lives.
    # A container's own filesystem is thrown away when it is removed. A volume
    # is storage that outlives the container, so your tables survive a restart.
    # Left out, every `docker compose down` would wipe the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # How Docker knows Postgres is not just running, but ready to accept
    # connections. There is a gap of a few seconds between the two, and things
    # that connect during that gap fail. Later services will wait on this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcourse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal, for the publishing workflow. Guidelines Week 2 names it, and
  # Part A's tech stack lists it as "Temporal (workflows)".
  #
  # This is the *development* server: one container holding the server, its
  # storage and its web UI. The production shape is five containers - Postgres,
  # a schema-setup job, the server, a namespace-creation job, and a separate
  # UI - which is what temporalio/samples-server publishes. We do not need any
  # of that to learn the programming model, and every extra container is
  # another thing that can fail on a laptop.
  #
  # What we give up: history is kept in a SQLite file rather than Postgres,
  # so this is not how it would be deployed. Worth being able to say out loud.
  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped

    # 7233 is the gRPC port our worker and API connect to.
    # 8233 serves the web UI - open it to watch a workflow run step by step.
    ports:
      - "7233:7233"
      - "8233:8233"

    # Temporal's own bookkeeping: which step each workflow reached, what every
    # activity returned, what failed and what is still pending. Without the
    # volume, every restart forgets every workflow - which is the one thing
    # Temporal exists not to do.
    volumes:
      - temporal-data:/home/temporal

    # --ip 0.0.0.0 makes it listen on all interfaces inside the container, so
    # the published ports above actually reach it. Bound to localhost (the
    # default) it would only be reachable from inside the container.
    #
    # start-dev also creates the "default" namespace on its own. The
    # production setup needs a separate container just for that.
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db

    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka. The record of things that happened, which other services read.
  #
  # Not a queue, despite looking like one. RabbitMQ (arriving with Celery)
  # hands a message to one worker and deletes it; Kafka appends the message
  # to a topic and *keeps* it. Several consumers each read the whole topic at
  # their own pace, and a consumer that got something wrong can rewind and
  # read it again.
  #
  # That retention is the reason both end up in this file. "Extract the text
  # from this PDF" is worthless once done - a queue. "Ali enrolled in
  # JavaScript on 1 November" is still true next year, and something not yet
  # written will want to know - a log.
  kafka:
    # 8.x, the current line. Pinned to a minor version for the same reason
    # postgres is pinned to 16.
    image: confluentinc/cp-kafka:8.0.0
    restart: unless-stopped

    ports:
      # The only port anything outside Docker uses. Our producer and
      # consumers connect here.
      - "9092:9092"

    environment:
      # --- KRaft -------------------------------------------------------
      #
      # Kafka used to need a second service, ZooKeeper, to keep track of
      # which broker is in charge. KRaft replaced it: the broker does that
      # bookkeeping itself. Every tutorial older than about 2023 still shows
      # the ZooKeeper container - it is not needed and should not be copied.
      #
      # One process playing both parts, which is right for one machine and
      # wrong for production, where they are separated.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- listeners ---------------------------------------------------
      #
      # Two addresses for the same broker, and the duplication is the point.
      # A client first asks Kafka "where are your brokers?" and then connects
      # to whatever it is told. So the answer has to be right for *who is
      # asking*, and there are two kinds of asker:
      #
      #   our app on Windows        reaches it as localhost:9092
      #   another container         reaches it as kafka:29092
      #
      # Tell everyone "localhost:9092" and containers fail, because inside a
      # container localhost is itself. This is the single most common Kafka
      # setup problem and it is always this.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- one broker, so nothing can be copied anywhere ----------------
      #
      # Kafka normally keeps several copies of everything on different
      # machines. There is one machine here, so every "how many copies"
      # setting has to say 1 - the defaults are 3 and the broker refuses to
      # start without them.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Off, which is how production runs it. With it on, writing to a
      # mistyped topic silently creates one - and the new topic gets the
      # broker's default partition count rather than the one the design
      # asked for, with nothing to say so. kafka-init below creates the
      # three real topics, the way the migrate service creates tables.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # How long a message is kept whether or not anyone has read it. Seven
      # days is Kafka's default and plenty here - it is the window in which
      # a broken consumer can be fixed and rewound.
      KAFKA_LOG_RETENTION_HOURS: 168

      CLUSTER_ID: smartcourse-local-cluster

    # The messages themselves. Without this, restarting the container
    # forgets every event - which would make the remembering that Kafka is
    # here for last exactly as long as the container does.
    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Create the topics, then exit. The same shape as the migrate service,
  # and for the same reasons: it runs once, it is visible when it fails,
  # and the application is not made responsible for setting up its own
  # infrastructure.
  #
  # Partition counts live here, beside the topic names, which is where
  # somebody looking for them will think to look. Leaving it to
  # auto-creation would put the real answer in a broker default that
  # nothing in this project mentions.
  #
  # `--if-not-exists` makes it safe to run again. Note it does *not* fix up
  # a topic that already exists with the wrong settings - partition counts
  # can be raised later with --alter, never lowered, and raising one
  # reshuffles which key lands where.
  kafka-init:
    image: confluentinc/cp-kafka:8.0.0
    depends_on:
      kafka:
        condition: service_healthy
    # kafka:29092 - this is a container asking, so it needs the address the
    # broker advertises to other containers.
    #
    # One command per line. In a YAML folded block (>) a line indented more
    # than the first keeps its newline instead of being folded into a
    # space - so a wrapped `--topic ...` arrives as its own command and
    # bash reports "--topic: command not found".
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcourse.users --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcourse.courses --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic smartcourse.enrollments --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  # Somewhere to look at the topics, the way Temporal's UI shows workflows.
  #
  # Worth the container. Kafka has no visible output of its own, so without
  # this the only way to find out whether a message arrived is to write a
  # consumer and print it.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartcourse
      # kafka:29092, not localhost:9092 - this is a container asking, so it
      # needs the address the other container answers on.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # Apply migrations, then exit.
  #
  # Its own service rather than something the API does at startup. Two
  # reasons: running several API containers would mean several of them
  # migrating at once, and a migration failure should stop the deploy rather
  # than leave a server running against a schema it does not match.
  #
  # `service_completed_successfully` below is what makes the API wait for it.
  migrate:
    build: .
    command: uv run alembic upgrade head
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      # "postgres", not "localhost". Inside a container localhost is the
      # container itself; the service name is how Docker's DNS finds the
      # database.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  # Create the first admin, then exit. Beside migrate, and for the same
  # reason: it is a job, not a server.
  #
  # Admin is not self-assignable and no endpoint grants it, so without this
  # the only way to get one is editing the database by hand - which is what
  # the Week 1 review found.
  #
  # Runs on every `docker compose up` and is safe to. With no ADMIN_EMAIL set
  # it prints a line and exits 0, so a fresh clone with no .env still comes
  # up green. With one set it creates the account, and running again finds it
  # already there and changes nothing.
  seed:
    build: .
    command: uv run python -m smartcourse.seed
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Passed through from your shell or .env, with no default here. A
      # default admin password is a published admin password.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      # After the tables exist, obviously - it inserts a row.
      migrate:
        condition: service_completed_successfully

  # The API.
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ENVIRONMENT: local
    depends_on:
      # Not just "postgres is healthy" - the schema has to exist too, or the
      # first request fails on a missing table.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# Declares the volumes used above. Docker manages where they physically sit.
volumes:
  postgres-data:
  temporal-data:
  kafka-data:
