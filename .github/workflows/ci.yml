name: CI

# Every push and every pull request. Tests that only run when somebody
# remembers to run them are tests that stop running.
#
# Pushes to main and to module-* branches, and every pull request.
#
# The `module` prefix is reserved for the one main branch per module -
# module-2-enrollment. Everything else puts its subject first and names the
# module at the end: review-fixes-module-1, bugfix-module-2-enrollment.
#
# So the pattern is not a guess at what branches might be called. It is the
# thing that marks a branch as a module's trunk, and push runs follow it.
#
# A fix branch therefore gets no push runs - only the one its pull request
# triggers. Deliberate, and bounded: `pull_request` has no branch filter, so
# nothing reaches main untested whatever it is called. The cost is no
# feedback while a fix branch is being worked on, before its PR exists.
#
# `pull_request` is kept even though push already covers module branches,
# because it asks a different question: it builds a temporary merge of the
# branch with main and tests *that*. A push run only tests the branch as it
# stands, so it cannot see a failure that appears once the two are combined.
on:
  push:
    branches: ["main", "module-*"]
  pull_request:

# Pushing again before a run finishes cancels the first. Only the newest
# commit's result matters, and this stops a queue forming behind three pushes
# in a row.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite needs a real Postgres. Not a mock and not SQLite: the schema
    # leans on things only Postgres has - DEFERRABLE constraints, partial
    # unique indexes, text[] columns, SELECT ... FOR UPDATE. A different
    # database would pass tests that say nothing about production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcourse
          POSTGRES_PASSWORD: smartcourse
          POSTGRES_DB: smartcourse
        ports:
          - 5432:5432
        # Without this the job races the database and fails at the first
        # connection. There is a gap of a few seconds between "container
        # running" and "accepting connections".
        options: >-
          --health-cmd "pg_isready -U smartcourse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # conftest.py overrides POSTGRES_DB to smartcourse_test and creates it
      # per run, so the value above is only used for the initial connection.
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Caches the dependency download between runs, keyed on uv.lock.
          enable-cache: true

      - name: Install dependencies
        # --frozen fails if uv.lock does not match pyproject.toml, so a
        # dependency added without updating the lockfile is caught here
        # rather than working on one machine and not another.
        run: uv sync --frozen

      # Temporal, for the publishing workflow tests.
      #
      # Started as a step rather than declared under `services:`, because a
      # service container cannot override the image's command and the dev
      # server needs `server start-dev`. Same image and same flags as
      # compose.yml, so CI and a laptop run the same thing.
      #
      # Without this the six workflow tests skip rather than fail - and a
      # skipped test in CI looks exactly like a passing one, which would
      # leave FR-13's compensation unproven while the build stayed green.
      - name: Start Temporal
        run: |
          docker run -d --name temporal -p 7233:7233             temporalio/temporal:latest             server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db

      # The same race as the Postgres health check: there is a gap between
      # "container running" and "accepting connections".
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 30); do
            if docker exec temporal temporal operator cluster health                  --address localhost:7233 >/dev/null 2>&1; then
              echo "Temporal is serving"
              exit 0
            fi
            sleep 2
          done
          echo "Temporal did not come up"
          docker logs temporal
          exit 1

      - name: Run tests
        run: uv run pytest -v
